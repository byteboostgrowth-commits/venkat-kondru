<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <!-- Terracotta Clay Handi Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D4C28" />
      <stop offset="40%" stop-color="#6B3315" />
      <stop offset="100%" stop-color="#461E0A" />
    </linearGradient>

    <!-- Food Rice / Curry Gradient -->
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A024" />
      <stop offset="50%" stop-color="#F2C24F" />
      <stop offset="100%" stop-color="#D98218" />
    </linearGradient>

    <!-- Firewood Logs Gradient -->
    <linearGradient id="woodLog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3419" />
      <stop offset="100%" stop-color="#361B0A" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <filter id="chutneyShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- TOP ILLUSTRATION: CLAY HANDI WITH FOOD ON FIREWOOD LOGS  -->
  <!-- ======================================================== -->
  <g transform="translate(300, 135)" filter="url(#chutneyShadow)">
    <!-- Firewood Logs at base -->
    <g stroke="#261206" stroke-width="2">
      <!-- Left Log -->
      <ellipse cx="-75" cy="112" rx="14" ry="8" fill="#78421E" />
      <rect x="-80" y="104" width="70" height="16" rx="4" transform="rotate(15 -45 112)" fill="url(#woodLog)" />
      <!-- Right Log -->
      <ellipse cx="75" cy="112" rx="14" ry="8" fill="#78421E" />
      <rect x="10" y="104" width="70" height="16" rx="4" transform="rotate(-15 45 112)" fill="url(#woodLog)" />
    </g>

    <!-- Left Handle -->
    <path d="M -110 -25 C -150 -10, -150 50, -100 65 C -112 45, -112 5, -92 -15 Z" fill="#8D4C28" stroke="#461E0A" stroke-width="2.5" />
    <!-- Right Handle -->
    <path d="M 110 -25 C 150 -10, 150 50, 100 65 C 112 45, 112 5, 92 -15 Z" fill="#8D4C28" stroke="#461E0A" stroke-width="2.5" />

    <!-- Terracotta Clay Pot Body -->
    <path d="M -115 0 C -125 50, -90 95, 0 95 C 90 95, 125 50, 115 0 C 100 12, -100 12, -115 0 Z" fill="url(#potGrad)" stroke="#461E0A" stroke-width="3" />
    
    <!-- Pot Neck & Lip -->
    <ellipse cx="0" cy="-2" rx="112" ry="24" fill="#8D4C28" stroke="#461E0A" stroke-width="3" />
    <ellipse cx="0" cy="-10" rx="104" ry="20" fill="#5A270D" />

    <!-- Decorative Folk Patterns on Pot (Traditional Handi Markings) -->
    <!-- Wavy line -->
    <path d="M -90 35 Q -70 25, -50 35 T -10 35 T 30 35 T 70 35 T 90 35" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.8" />
    <!-- Dots pattern -->
    <g fill="#FDE68A" opacity="0.8">
      <circle cx="-70" cy="50" r="3" />
      <circle cx="-50" cy="52" r="3" />
      <circle cx="-30" cy="54" r="3" />
      <circle cx="-10" cy="55" r="3" />
      <circle cx="10" cy="55" r="3" />
      <circle cx="30" cy="54" r="3" />
      <circle cx="50" cy="52" r="3" />
      <circle cx="70" cy="50" r="3" />
    </g>

    <!-- Mound of Spiced Rice / Food in Handi -->
    <path d="M -96 -12 C -80 -48, -40 -62, 0 -62 C 40 -62, 80 -48, 96 -12 Z" fill="url(#foodGrad)" stroke="#B45309" stroke-width="2" />
    <!-- Rice grain texture specks -->
    <g fill="#92400E" opacity="0.6">
      <ellipse cx="-40" cy="-35" rx="3" ry="1.5" transform="rotate(25 -40 -35)" />
      <ellipse cx="-20" cy="-45" rx="3.5" ry="1.5" transform="rotate(-15 -20 -45)" />
      <ellipse cx="0" cy="-50" rx="3" ry="1.5" transform="rotate(40 0 -50)" />
      <ellipse cx="25" cy="-42" rx="3.5" ry="1.5" transform="rotate(-30 25 -42)" />
      <ellipse cx="50" cy="-30" rx="3" ry="1.5" transform="rotate(20 50 -30)" />
      <ellipse cx="-15" cy="-25" rx="3" ry="1.5" transform="rotate(50 -15 -25)" />
      <ellipse cx="20" cy="-22" rx="3" ry="1.5" transform="rotate(-40 20 -22)" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER CREAM SIGNBOARD: THE CHUTNEYS                     -->
  <!-- ======================================================== -->
  <g transform="translate(300, 350)" filter="url(#chutneyShadow)">
    <!-- Cream Parchment Base -->
    <rect x="-280" y="-85" width="560" height="175" rx="18" fill="#FFFDF5" stroke="#4A2810" stroke-width="4" />
    <!-- Inner Fine Border Line -->
    <rect x="-272" y="-77" width="544" height="159" rx="12" fill="none" stroke="#B45309" stroke-width="1.5" opacity="0.6" />

    <!-- "THE" with accent lines -->
    <g transform="translate(0, -48)">
      <line x1="-120" y1="-5" x2="-45" y2="-5" stroke="#B45309" stroke-width="1.5" />
      <text x="0" y="0" 
            font-family="'Playfair Display', 'Georgia', serif" 
            font-size="24" 
            font-weight="bold" 
            letter-spacing="5" 
            text-anchor="middle" 
            fill="#18181B">
        THE
      </text>
      <line x1="45" y1="-5" x2="120" y2="-5" stroke="#B45309" stroke-width="1.5" />
    </g>

    <!-- "CHUTNEYS" in massive vintage western bold serif -->
    <text x="0" y="24" 
          font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
          font-size="78" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#18181B">
      CHUTNEYS
    </text>

    <!-- "AUTHENTIC INDIAN RESTAURANT" Subtitle -->
    <g transform="translate(0, 58)">
      <line x1="-220" y1="-5" x2="-160" y2="-5" stroke="#18181B" stroke-width="1.5" />
      <text x="0" y="0" 
            font-family="'Montserrat', 'Arial', sans-serif" 
            font-size="16" 
            font-weight="800" 
            letter-spacing="4" 
            text-anchor="middle" 
            fill="#18181B">
        AUTHENTIC INDIAN RESTAURANT
      </text>
      <line x1="160" y1="-5" x2="220" y2="-5" stroke="#18181B" stroke-width="1.5" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM RED RIBBON BANNER: MIDRAND, JOHANNESBURG          -->
  <!-- ======================================================== -->
  <g transform="translate(300, 468)" filter="url(#chutneyShadow)">
    <!-- Left Ribbon Swallowtail Fold -->
    <path d="M -220 0 L -250 -18 L -235 0 L -250 18 Z" fill="#991B1B" />
    <path d="M -200 18 L -200 0 L -220 0 L -220 18 Z" fill="#7F1D1D" />

    <!-- Right Ribbon Swallowtail Fold -->
    <path d="M 220 0 L 250 -18 L 235 0 L 250 18 Z" fill="#991B1B" />
    <path d="M 200 18 L 200 0 L 220 0 L 220 18 Z" fill="#7F1D1D" />

    <!-- Main Front Center Ribbon Plaque -->
    <rect x="-210" y="-18" width="420" height="38" rx="4" fill="url(#ribbonRed)" stroke="#7F1D1D" stroke-width="1.5" />

    <!-- Ribbon Text -->
    <text x="0" y="8" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="20" 
          font-weight="800" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="#FFFFFF">
      MIDRAND, JOHANNESBURG
    </text>
  </g>
</svg>
