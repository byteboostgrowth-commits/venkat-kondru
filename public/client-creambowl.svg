<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Peach-Gold Gradients matching Cream Bowl.jpg -->
    <linearGradient id="cbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD4BD" />
      <stop offset="25%" stop-color="#F7A882" />
      <stop offset="60%" stop-color="#E2895E" />
      <stop offset="85%" stop-color="#F5B290" />
      <stop offset="100%" stop-color="#C96B40" />
    </linearGradient>

    <linearGradient id="cbNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E47" />
      <stop offset="50%" stop-color="#0E1638" />
      <stop offset="100%" stop-color="#080E26" />
    </linearGradient>

    <filter id="cbSoftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Oval Navy Badge with Metallic Peach-Gold Rim -->
  <g transform="translate(300, 205)">
    <!-- Outer Navy & Gold Border Rings -->
    <ellipse cx="0" cy="0" rx="275" ry="180" fill="url(#cbGoldGrad)" />
    <ellipse cx="0" cy="0" rx="252" ry="160" fill="url(#cbNavyGrad)" />
    <ellipse cx="0" cy="0" rx="242" ry="150" fill="none" stroke="url(#cbGoldGrad)" stroke-width="2" opacity="0.6" />

    <!-- Ice Cream Soft-Serve Swirl at top center -->
    <g transform="translate(18, -85) scale(0.9)" filter="url(#cbSoftGlow)">
      <!-- Swirl tip -->
      <path d="M 0 -35 C 8 -30, 16 -16, 12 -5 C 9 4, -2 8, -6 6 C -12 3, -12 -8, -4 -20 Z" fill="url(#cbGoldGrad)" />
      <!-- Middle swirl layer -->
      <path d="M -18 2 C -24 6, -22 18, -10 20 C 8 22, 22 20, 20 8 C 18 -2, 2 -3, -18 2 Z" fill="url(#cbGoldGrad)" />
      <!-- Base swirl layer -->
      <path d="M -26 18 C -30 25, -16 34, 0 34 C 18 34, 28 25, 24 16 C 20 10, -16 8, -26 18 Z" fill="url(#cbGoldGrad)" />
    </g>

    <!-- "Cream" Script Typography -->
    <g filter="url(#cbSoftGlow)">
      <text x="0" y="-10" 
            font-family="'Brush Script MT', 'Great Vibes', 'Playfair Display', cursive, serif" 
            font-size="115" 
            font-weight="bold"
            font-style="italic" 
            text-anchor="middle" 
            fill="url(#cbGoldGrad)">
        Cream
      </text>
    </g>

    <!-- "Bowl" Script Typography -->
    <g filter="url(#cbSoftGlow)">
      <text x="-15" y="85" 
            font-family="'Brush Script MT', 'Great Vibes', 'Playfair Display', cursive, serif" 
            font-size="105" 
            font-weight="bold"
            font-style="italic" 
            text-anchor="middle" 
            fill="url(#cbGoldGrad)">
        Bowl
      </text>
      <!-- Script flourish dot on the right -->
      <circle cx="145" cy="55" r="16" fill="url(#cbGoldGrad)" />
      <path d="M 145 70 C 145 88, 125 125, 115 130 C 110 133, 138 100, 145 70 Z" fill="url(#cbGoldGrad)" />
    </g>

    <!-- "Premium ice cream" Script Subtitle -->
    <text x="0" y="125" 
          font-family="'Playfair Display', 'Georgia', serif" 
          font-size="28" 
          font-style="italic" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="url(#cbGoldGrad)" 
          letter-spacing="1">
      Premium ice cream
    </text>
  </g>

  <!-- Tagline below badge: "Creamy fruits & nuts" -->
  <text x="300" y="450" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="40" 
        font-style="italic" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#111827">
    Creamy fruits &amp; nuts
  </text>
</svg>
