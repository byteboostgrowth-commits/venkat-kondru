<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White Background Rectangle -->
  <rect width="500" height="500" rx="10" fill="#FFFFFF" />

  <!-- ================= HERALDIC CREST ================= -->
  <g transform="translate(250, 160)">
    <!-- 1. Golden 5-Point Royal Crown at Top -->
    <g transform="translate(0, -60)" fill="#E5A912">
      <!-- Crown Base -->
      <path d="M -48 20 L 48 20 C 48 25, -48 25, -48 20 Z" />
      <rect x="-48" y="16" width="96" height="5" rx="1" fill="#D97706" />
      <!-- Jewels on band -->
      <circle cx="-32" cy="18" r="2" fill="#FFFFFF" />
      <circle cx="0" cy="18" r="2.5" fill="#FFFFFF" />
      <circle cx="32" cy="18" r="2" fill="#FFFFFF" />
      <!-- Five Spikes of the Crown with Pearls on tips -->
      <path d="M -48 16 L -55 -10 L -30 6 L 0 -22 L 30 6 L 55 -10 L 48 16 Z" />
      <!-- Pearl tops -->
      <circle cx="-55" cy="-12" r="4" />
      <circle cx="-25" cy="0" r="3.5" />
      <circle cx="0" cy="-25" r="5" />
      <circle cx="25" cy="0" r="3.5" />
      <circle cx="55" cy="-12" r="4" />
    </g>

    <!-- 2. Golden Laurel Wreath flanking the shield -->
    <!-- Left Laurel Branch -->
    <g fill="#E5A912">
      <!-- Outer curved stem -->
      <path d="M -45 110 C -115 100, -140 0, -85 -55" stroke="#E5A912" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M -85 -50 C -105 -55, -112 -40, -95 -35 C -82 -42, -85 -50, -85 -50 Z" />
      <path d="M -102 -30 C -122 -32, -125 -15, -108 -12 C -98 -20, -102 -30, -102 -30 Z" />
      <path d="M -112 -6 C -132 -6, -132 12, -115 12 C -106 3, -112 -6, -112 -6 Z" />
      <path d="M -114 18 C -132 22, -128 40, -112 38 C -105 28, -114 18, -114 18 Z" />
      <path d="M -108 44 C -124 52, -116 68, -100 62 C -96 52, -108 44, -108 44 Z" />
      <path d="M -95 68 C -108 78, -96 94, -80 85 C -80 75, -95 68, -95 68 Z" />
      <path d="M -75 90 C -85 102, -70 114, -58 102 C -60 92, -75 90, -75 90 Z" />
    </g>

    <!-- Right Laurel Branch -->
    <g fill="#E5A912">
      <!-- Outer curved stem -->
      <path d="M 45 110 C 115 100, 140 0, 85 -55" stroke="#E5A912" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M 85 -50 C 105 -55, 112 -40, 95 -35 C 82 -42, 85 -50, 85 -50 Z" />
      <path d="M 102 -30 C 122 -32, 125 -15, 108 -12 C 98 -20, 102 -30, 102 -30 Z" />
      <path d="M 112 -6 C 132 -6, 132 12, 115 12 C 106 3, 112 -6, 112 -6 Z" />
      <path d="M 114 18 C 132 22, 128 40, 112 38 C 105 28, 114 18, 114 18 Z" />
      <path d="M 108 44 C 124 52, 116 68, 100 62 C 96 52, 108 44, 108 44 Z" />
      <path d="M 95 68 C 108 78, 96 94, 80 85 C 80 75, 95 68, 95 68 Z" />
      <path d="M 75 90 C 85 102, 70 114, 58 102 C 60 92, 75 90, 75 90 Z" />
    </g>

    <!-- 3. Royal Blue Heraldic Shield -->
    <!-- Gold Outer Border of Shield -->
    <path d="M -72 -30 L 72 -30 L 72 45 C 72 90, 0 125, 0 125 C 0 125, -72 90, -72 45 Z" fill="#E5A912" />
    
    <!-- Darker Gold Accent Rim -->
    <path d="M -66 -25 L 66 -25 L 66 45 C 66 85, 0 118, 0 118 C 0 118, -66 85, -66 45 Z" fill="#B45309" />
    
    <!-- Royal Deep Blue Shield Core -->
    <path d="M -62 -22 L 62 -22 L 62 44 C 62 82, 0 114, 0 114 C 0 114, -62 82, -62 44 Z" fill="#0C3875" />

    <!-- 4. Inside Shield: White House Roof Silhouette & Bold "AK" -->
    <!-- Gable Roof Outline with chimney/eaves -->
    <path d="M 0 -8 L -42 22 L -32 22 L 0 -2 L 32 22 L 42 22 Z" fill="#FFFFFF" />
    <rect x="18" y="2" width="6" height="12" fill="#FFFFFF" />

    <!-- Bold Monogram "AK" in White -->
    <text x="0" y="68" 
          font-family="'Cinzel', 'Times New Roman', serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#FFFFFF">
      AK
    </text>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- "AK GROUPS" in Royal Navy Blue Serif -->
  <text x="250" y="380" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="#0C3875">
    AK GROUPS
  </text>

  <!-- "ELEGANT & PERFECT" in Regal Gold -->
  <text x="250" y="420" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#C99218">
    ELEGANT &amp; PERFECT
  </text>
</svg>
