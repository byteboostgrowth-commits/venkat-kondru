<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Metallic Rose Gold Gradient -->
    <linearGradient id="avRoseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8E1" />
      <stop offset="25%" stop-color="#E29B88" />
      <stop offset="55%" stop-color="#C77864" />
      <stop offset="80%" stop-color="#DE9180" />
      <stop offset="100%" stop-color="#9C4B38" />
    </linearGradient>

    <!-- Pink Satin Silk Gown Gradient -->
    <linearGradient id="avPinkSatin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F2" />
      <stop offset="35%" stop-color="#F8C9BE" />
      <stop offset="70%" stop-color="#EEA899" />
      <stop offset="100%" stop-color="#D98270" />
    </linearGradient>

    <filter id="av3dGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8F3E2E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Soft Luxury Blush Pink Background matching Aavira Boutique.jpg -->
  <rect width="500" height="500" rx="20" fill="#FDF3F1" />
  
  <!-- Outer Circular Rose Gold Hoop -->
  <circle cx="250" cy="175" r="125" fill="none" stroke="url(#avRoseGoldGrad)" stroke-width="4.5" />
  
  <!-- Delicate Laurel Leaf Sprig with Pearls entwined on right of hoop -->
  <g transform="translate(325, 115)" stroke="url(#avRoseGoldGrad)" stroke-width="2" fill="url(#avPinkSatin)">
    <path d="M 0 60 Q 25 30, 45 -10" fill="none" />
    <ellipse cx="14" cy="45" rx="8" ry="4" transform="rotate(-30 14 45)" />
    <circle cx="18" cy="40" r="2.5" fill="#FFF" />
    <ellipse cx="28" cy="25" rx="9" ry="4.5" transform="rotate(-20 28 25)" />
    <circle cx="34" cy="20" r="2.5" fill="#FFF" />
    <ellipse cx="40" cy="5" rx="8" ry="4" transform="rotate(-15 40 5)" />
    <circle cx="45" cy="0" r="2" fill="#FFF" />
    <ellipse cx="48" cy="-12" rx="7" ry="3.5" transform="rotate(-10 48 -12)" />
  </g>

  <!-- Luxury Monogram 'A' blended with Evening Gown Mannequin -->
  <g transform="translate(250, 175)" filter="url(#av3dGlow)">
    <!-- Right leg of 'A' in Rose Gold 3D -->
    <path d="M 8 -90 L 28 -90 L 108 75 L 78 75 Z" fill="url(#avRoseGoldGrad)" />
    
    <!-- Flowing couture gown forming the left curve of 'A' -->
    <!-- Dressmaker Mannequin bust -->
    <path d="M -48 -60 C -52 -75, -28 -75, -28 -60 C -28 -40, -42 -20, -40 0 C -38 15, -45 20, -55 20 C -60 20, -60 -40, -48 -60 Z" fill="url(#avPinkSatin)" stroke="url(#avRoseGoldGrad)" stroke-width="1.5" />
    <!-- Neck and Finial -->
    <line x1="-38" y1="-68" x2="-38" y2="-78" stroke="url(#avRoseGoldGrad)" stroke-width="3" />
    <circle cx="-38" cy="-82" r="3.5" fill="url(#avRoseGoldGrad)" />

    <!-- Cascading flared silk evening gown train -->
    <path d="M -42 -10 C -25 15, -10 30, 68 32 C 10 36, -30 38, -60 55 C -85 68, -110 75, -125 72 C -115 60, -95 45, -75 35 C -65 25, -55 10, -42 -10 Z" fill="url(#avPinkSatin)" stroke="url(#avRoseGoldGrad)" stroke-width="2" />
    <!-- Gown silk pleats -->
    <path d="M -48 10 Q -65 45, -95 68 M -38 18 Q -48 48, -70 70 M -28 22 Q -30 52, -45 72" stroke="url(#avRoseGoldGrad)" stroke-width="1.2" fill="none" opacity="0.6" />

    <!-- Flowing ribbon sash forming crossbar of 'A' and curving gracefully -->
    <path d="M -50 20 C -20 16, 20 24, 85 30 C 110 35, 125 50, 115 65 C 105 52, 90 40, 75 34" stroke="url(#avRoseGoldGrad)" stroke-width="4.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Luxury Brand Title: A A V I R A in 3D Rose Gold Serif -->
  <text x="250" y="370" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="45" 
        font-weight="700" 
        letter-spacing="16" 
        text-anchor="middle" 
        fill="url(#avRoseGoldGrad)" 
        filter="url(#av3dGlow)">
    AAVIRA
  </text>

  <!-- Coat Hanger & Filigree Divider Motif -->
  <g transform="translate(250, 400)" stroke="url(#avRoseGoldGrad)" stroke-width="2" fill="none">
    <line x1="-135" y1="0" x2="-40" y2="0" />
    <circle cx="-135" cy="0" r="3.5" fill="url(#avRoseGoldGrad)" />
    
    <!-- Mini Coat Hanger in center -->
    <path d="M 0 -11 C 6 -15, 6 -22, 0 -22 C -6 -22, -6 -16, 0 -13 L 0 -5 L -22 6 L 22 6 Z" stroke-width="2" />
    
    <line x1="40" y1="0" x2="135" y2="0" />
    <circle cx="135" cy="0" r="3.5" fill="url(#avRoseGoldGrad)" />
  </g>

  <!-- Tagline: CLOTHING THAT DEFINES YOU -->
  <text x="250" y="432" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#A55442">
    CLOTHING THAT DEFINES YOU
  </text>

  <!-- Ornate Baroque Flourish at bottom -->
  <g transform="translate(250, 458)" stroke="url(#avRoseGoldGrad)" stroke-width="1.5" fill="none">
    <path d="M 0 0 C -15 -8, -35 -5, -45 5 C -35 2, -25 8, -20 12 C -25 8, -35 8, -40 2" stroke-linecap="round" />
    <path d="M 0 0 C 15 -8, 35 -5, 45 5 C 35 2, 25 8, 20 12 C 25 8, 35 8, 40 2" stroke-linecap="round" />
    <circle cx="0" cy="5" r="2.5" fill="url(#avRoseGoldGrad)" />
  </g>
</svg>
