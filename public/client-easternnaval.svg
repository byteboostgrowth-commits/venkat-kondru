<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White Background Rectangle -->
  <rect width="500" height="500" rx="10" fill="#FFFFFF" />

  <!-- ================= OCTAGONAL NAVAL SHIELD ================= -->
  <!-- Outer Gold Octagon Border -->
  <polygon points="160,35 340,35 465,160 465,340 340,465 160,465 35,340 35,160" fill="#E5A912" />

  <!-- Inner Dark Blue Gap -->
  <polygon points="165,45 335,45 455,165 455,335 335,455 165,455 45,335 45,165" fill="#0C1D4A" />

  <!-- Second Gold Trim -->
  <polygon points="170,52 330,52 448,170 448,330 330,448 170,448 52,330 52,170" fill="#E5A912" />

  <!-- Deep Royal Navy Blue Shield Core -->
  <polygon points="175,60 325,60 440,175 440,325 325,440 175,440 60,325 60,175" fill="#0A2268" />

  <!-- ================= ASHOKA LION CAPITAL (STATE EMBLEM) ================= -->
  <g transform="translate(250, 155)" fill="#E5A912">
    <!-- Center Lion Profile & Mane -->
    <path d="M 0 -75 C -12 -75, -16 -60, -18 -45 C -25 -42, -28 -30, -22 -15 L -25 0 L 25 0 L 22 -15 C 28 -30, 25 -42, 18 -45 C 16 -60, 12 -75, 0 -75 Z" />
    
    <!-- Left Lion Profile -->
    <path d="M -18 -55 C -35 -55, -45 -40, -42 -25 C -40 -12, -30 -2, -25 0 L -18 -30 Z" />

    <!-- Right Lion Profile -->
    <path d="M 18 -55 C 35 -55, 45 -40, 42 -25 C 40 -12, 30 -2, 25 0 L 18 -30 Z" />

    <!-- Pedestal / Abacus -->
    <rect x="-38" y="0" width="76" height="8" rx="1" fill="#C99218" />
    <circle cx="0" cy="4" r="3" fill="#0A2268" />
    
    <!-- Base Ribbon Plinth: "सत्यमेव जयते" -->
    <path d="M -42 8 L 42 8 L 38 18 L -38 18 Z" fill="#E5A912" />
    <text x="0" y="16" font-family="'Noto Sans Devanagari', 'Arial', sans-serif" font-size="7" font-weight="900" text-anchor="middle" fill="#0A2268">
      सत्यमेव जयते
    </text>
  </g>

  <!-- ================= NAVAL FOUL ANCHOR & FILIGREE MANTLING ================= -->
  <g transform="translate(250, 280)" stroke="#E5A912" fill="#E5A912">
    <!-- Filigree Rococo Baroque Mantling Surrounding Anchor -->
    <path d="M -75 -75 
             C -90 -65, -95 -40, -85 -20 
             C -75 0, -95 15, -85 45 
             C -75 70, -40 85, -25 90 
             C -45 80, -65 65, -60 40 
             C -55 20, -70 5, -60 -20 
             C -55 -40, -65 -60, -75 -75 Z" 
          fill="#E5A912" stroke="none" />

    <path d="M 75 -75 
             C 90 -65, 95 -40, 85 -20 
             C 75 0, 95 15, 85 45 
             C 75 70, 40 85, 25 90 
             C 45 80, 65 65, 60 40 
             C 55 20, 70 5, 60 -20 
             C 55 -40, 65 -60, 75 -75 Z" 
          fill="#E5A912" stroke="none" />

    <!-- Anchor Ring at Top -->
    <circle cx="0" cy="-90" r="14" fill="none" stroke="#E5A912" stroke-width="6" />
    <circle cx="0" cy="-90" r="6" fill="#0A2268" stroke="none" />

    <!-- Anchor Stock (Horizontal Crossbar) -->
    <path d="M -45 -72 L 45 -72 L 40 -64 L -40 -64 Z" fill="#E5A912" stroke="none" />
    <circle cx="-45" cy="-68" r="4.5" fill="#E5A912" stroke="none" />
    <circle cx="45" cy="-68" r="4.5" fill="#E5A912" stroke="none" />

    <!-- Anchor Shank (Vertical Column) -->
    <line x1="0" y1="-70" x2="0" y2="40" stroke="#E5A912" stroke-width="12" stroke-linecap="round" />

    <!-- Flukes and Crown (Curved Crescent Bottom) -->
    <path d="M -50 -10 
             C -50 40, -25 60, 0 60 
             C 25 60, 50 40, 50 -10 
             L 38 -10 
             C 38 30, 20 48, 0 48 
             C -20 48, -38 30, -38 -10 
             Z" 
          fill="#E5A912" stroke="none" />

    <!-- Arrow Fluke Tips -->
    <polygon points="-50,-10 -65,-5 -35,-2" fill="#E5A912" stroke="none" />
    <polygon points="50,-10 65,-5 35,-2" fill="#E5A912" stroke="none" />

    <!-- Crown point at bottom -->
    <polygon points="-8,58 8,58 0,72" fill="#E5A912" stroke="none" />
  </g>

  <!-- ================= MOTTO RIBBON BANNER: शं नो वरुणः ================= -->
  <g transform="translate(250, 395)">
    <!-- Blue Ribbon with Golden Trim -->
    <path d="M -120 -15 
             C -60 -25, 60 -25, 120 -15 
             L 110 22 
             C 55 12, -55 12, -110 22 
             Z" 
          fill="#0A2268" stroke="#E5A912" stroke-width="2.5" />
    
    <!-- Ribbon Tail Left -->
    <path d="M -120 -15 L -140 -5 L -125 15 L -110 22 Z" fill="#081845" stroke="#E5A912" stroke-width="2" />
    
    <!-- Ribbon Tail Right -->
    <path d="M 120 -15 L 140 -5 L 125 15 L 110 22 Z" fill="#081845" stroke="#E5A912" stroke-width="2" />

    <!-- Sacred Sanskrit Motto: शं नो वरुणः -->
    <text x="0" y="8" 
          font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', Arial, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#FFFFFF">
      शं नो वरुणः
    </text>
  </g>
</svg>
