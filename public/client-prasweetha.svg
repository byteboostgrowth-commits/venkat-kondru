<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 500" width="100%" height="100%">
  <!-- White Background Rectangle -->
  <rect width="550" height="500" rx="10" fill="#FFFFFF" />

  <!-- ================= EMBLEM ================= -->
  <g transform="translate(275, 175)">
    <!-- 1. Golden Sunburst Aura on the Right -->
    <path d="M 40 -120 
             C 120 -100, 180 -20, 160 60 
             C 140 120, 80 150, 40 160 
             L 55 130 C 85 120, 130 95, 135 45 C 140 -5, 95 -65, 45 -85 Z" 
          fill="#F5D061" />
    <!-- Sun Ray Petals / Scallops -->
    <g fill="#F5D061">
      <circle cx="95" cy="-85" r="7" />
      <circle cx="140" cy="-45" r="8" />
      <circle cx="165" cy="10" r="8" />
      <circle cx="155" cy="70" r="8" />
      <circle cx="115" cy="120" r="7.5" />
      <circle cx="65" cy="150" r="6" />
    </g>

    <!-- 2. Dark Teal Crest with Medical Cross -->
    <path d="M -15 -80 
             C 45 -95, 95 -50, 95 10 
             C 95 65, 40 110, -35 125 
             C -2 95, 45 60, 45 10 
             C 45 -35, 15 -65, -15 -80 Z" 
          fill="#0D7377" />
    
    <!-- White Medical Cross inside Teal Crest -->
    <g transform="translate(25, -40)" fill="#FFFFFF">
      <rect x="-6" y="-18" width="12" height="36" rx="2" />
      <rect x="-18" y="-6" width="36" height="12" rx="2" />
    </g>

    <!-- Green Leaf Arc underneath the Teal Crest -->
    <path d="M -75 135 
             C -10 120, 45 70, 60 10 
             C 52 50, 5 95, -55 125 Z" 
          fill="#4EAF46" />

    <!-- 3. Dynamic Orange Human Figure leaping upwards -->
    <!-- Orange Torso & Sweeping Legs -->
    <path d="M -125 135 
             C -105 75, -70 15, -42 -25 
             C -32 -40, -22 -65, -20 -95 
             C -28 -55, -45 -15, -60 15 
             C -75 45, -95 90, -125 135 Z" 
          fill="#F97316" />
    <!-- Reaching Upward Arm Curve -->
    <path d="M -42 -25 C -35 -50, -25 -75, -18 -105 C -22 -85, -28 -60, -38 -35 Z" fill="#F97316" />
    <!-- Orange Circular Head -->
    <circle cx="-50" cy="-45" r="15" fill="#F97316" />

    <!-- 4. Academic Graduation Cap & Stethoscope -->
    <!-- Black Diamond Mortarboard Cap -->
    <g transform="translate(-75, -65)">
      <polygon points="0,-18 35,0 0,18 -35,0" fill="#263238" />
      <!-- Cap base -->
      <path d="M -18 8 L -18 20 C -18 26, 18 26, 18 20 L 18 8 Z" fill="#37474F" />
      <!-- Tassel loop -->
      <path d="M 0 0 Q -25 10, -32 25" stroke="#263238" stroke-width="2" fill="none" />
      <circle cx="-32" cy="26" r="2.5" fill="#263238" />
    </g>

    <!-- Stethoscope curving gracefully above cap -->
    <g stroke="#1E293B" stroke-width="2.5" fill="none">
      <path d="M -30 -105 C -25 -130, -5 -135, -5 -115 C -5 -95, -20 -85, -15 -65" />
      <circle cx="-30" cy="-105" r="4.5" fill="#1E293B" stroke="none" />
    </g>

    <!-- 5. Open Medical Knowledge Book at Bottom -->
    <g transform="translate(-70, 125)" stroke="#334155" stroke-width="2" fill="none">
      <path d="M -28 -15 Q 0 -5, 28 -15 L 26 8 Q 0 16, -28 6 Z" fill="#F8FAFC" />
      <path d="M 0 -7 L 0 14" />
      <path d="M -22 -8 Q -10 -2, -2 -6" />
      <path d="M -22 -2 Q -10 4, -2 0" />
      <path d="M 2 -6 Q 10 -2, 22 -8" />
      <path d="M 2 0 Q 10 4, 22 -2" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- "PRASWEETHA" in Tall Bold Teal Sans-Serif -->
  <text x="275" y="415" 
        font-family="'Montserrat', 'Century Gothic', 'Arial Black', sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="#0D7377">
    PRASWEETHA
  </text>

  <!-- "Multi Speciality Hospitals" in Refined Dark Gray -->
  <text x="275" y="455" 
        font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" 
        font-size="22" 
        font-weight="600" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#263238">
    Multi Speciality Hospitals
  </text>
</svg>
