<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Lime-to-Green Gradient for the Continuous JS / ICS Monogram -->
    <linearGradient id="icsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4F024" />
      <stop offset="25%" stop-color="#C2E600" />
      <stop offset="65%" stop-color="#70C800" />
      <stop offset="100%" stop-color="#43A000" />
    </linearGradient>

    <!-- Arc Path for "IMPACT CONNECT SOLUTIONS" text along lower curve -->
    <path id="icsLowerArc" d="M 68 290 A 195 195 0 0 0 432 290" fill="none" />
  </defs>

  <!-- White Background Rectangle -->
  <rect width="500" height="500" rx="10" fill="#FFFFFF" />

  <!-- Circular Outer Frame with Dotted Accents -->
  <g transform="translate(250, 215)">
    <!-- Top Arc in Green -->
    <path d="M -160 -50 A 190 190 0 0 1 160 -50" fill="none" stroke="#108928" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-170" cy="-35" r="3.5" fill="#108928" />
    <circle cx="170" cy="-35" r="3.5" fill="#108928" />
    <circle cx="-185" cy="-10" r="3.5" fill="#108928" />
    <circle cx="185" cy="-10" r="3.5" fill="#108928" />
    <circle cx="-195" cy="20" r="3.5" fill="#108928" />
    <circle cx="195" cy="20" r="3.5" fill="#108928" />

    <!-- Top Text: • ICS • -->
    <text x="0" y="-188" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="12" 
          text-anchor="middle" 
          fill="#108928">
      • ICS •
    </text>

    <!-- ================= CENTER FLUID MONOGRAM: JS / ICS ================= -->
    <!-- Top Dot of the J -->
    <circle cx="-25" cy="-115" r="18" fill="url(#icsGrad)" />

    <!-- Continuous Smooth Tube / Pipe Monogram -->
    <!-- The ribbon starts below dot, goes down, loops left, forms bottom of J, crosses into S curve -->
    <path d="M -25 -80 
             L -25 0 
             C -25 22, -45 35, -75 35 
             C -105 35, -125 15, -125 -10 
             C -125 -32, -105 -48, -75 -48
             L 50 -48 
             C 80 -48, 105 -30, 105 0 
             C 105 25, 85 45, 55 45 
             L -55 45 
             C -90 45, -115 65, -115 95 
             C -115 125, -85 145, -45 145 
             L 65 145 
             C 100 145, 125 120, 125 90 
             C 125 62, 100 45, 75 45" 
          fill="none" 
          stroke="url(#icsGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Circular Lower Perimeter Text: IMPACT CONNECT SOLUTIONS -->
  <text font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#108928">
    <textPath href="#icsLowerArc" startOffset="50%" text-anchor="middle">
      • IMPACT CONNECT SOLUTIONS •
    </textPath>
  </text>

  <!-- Bottom Tagline: | YOUR DIGITAL GUIDE | -->
  <g transform="translate(250, 470)">
    <text x="0" y="0" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="19" 
          font-weight="800" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#108928">
      <tspan fill="#EAB308" font-weight="900">| </tspan>
      YOUR DIGITAL GUIDE
      <tspan fill="#EAB308" font-weight="900"> |</tspan>
    </text>
  </g>
</svg>
