<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <!-- White clean background container -->
  <rect width="500" height="450" rx="20" fill="#FFFFFF" />

  <!-- Green Stylized Elephant Shopping Bag Icon -->
  <g transform="translate(250, 105)">
    <!-- Rounded bag shape with elephant trunk outline in forest green -->
    <rect x="-42" y="-45" width="84" height="90" rx="22" fill="none" stroke="#228B22" stroke-width="7" />
    
    <!-- Bag Handle at top -->
    <path d="M -22 -45 L -22 -62 C -22 -72, 22 -72, 22 -62 L 22 -45" fill="none" stroke="#228B22" stroke-width="6" stroke-linecap="round" />
    
    <!-- Stylized Elephant Inner Lines & Trunk -->
    <!-- Eye dot -->
    <circle cx="20" cy="-15" r="4.5" fill="#228B22" />
    <!-- Curved ear and trunk creating bag compartment -->
    <path d="M -12 45 L -12 -10 C -12 -28, 15 -28, 15 15 C 15 32, 5 35, 5 22 L 5 45" fill="none" stroke="#228B22" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Telugu Brand Name: హంపి (Hampi) in bold vibrant red -->
  <g transform="translate(250, 260)">
    <!-- Stylized Telugu characters "హం" (Ham) and "పి" (Pi) with Temple Gopuram inside -->
    <!-- Custom drawn bold Telugu glyph representation matching the logo -->
    <g fill="#E02424">
      <!-- "హ" glyph -->
      <path d="M -160 0 C -175 -20, -180 -50, -150 -55 C -130 -58, -120 -40, -115 -20 C -110 -45, -90 -55, -70 -45 C -55 -35, -55 -15, -65 10 C -75 35, -115 35, -135 25 L -155 30 C -170 35, -185 20, -175 0 Z" />
      <circle cx="-135" cy="-22" r="8" fill="#FFF" />
      
      <!-- Bindu (Sunna) "ం" -->
      <circle cx="-35" cy="-12" r="32" fill="none" stroke="#E02424" stroke-width="20" />

      <!-- "పి" (Pi) glyph with Gopuram space in center -->
      <path d="M 30 -50 C 60 -65, 120 -65, 150 -50 C 175 -35, 175 10, 160 30 C 145 45, 100 45, 80 35 C 65 25, 60 0, 75 -20 C 90 -40, 130 -40, 140 -20" fill="none" stroke="#E02424" stroke-width="22" stroke-linecap="round" />
      <path d="M 40 -15 L 40 35" stroke="#E02424" stroke-width="20" stroke-linecap="round" />
    </g>

    <!-- Detailed Gopuram (Hampi Virupaksha Temple) in center of "పి" -->
    <g transform="translate(105, -10)" fill="#E02424">
      <!-- Kalasam tip -->
      <polygon points="0,-35 -3,-28 3,-28" />
      <!-- Tier 1 -->
      <polygon points="0,-28 -8,-20 8,-20" />
      <!-- Tier 2 -->
      <polygon points="0,-20 -12,-10 12,-10" />
      <!-- Tier 3 -->
      <polygon points="0,-10 -16,2 16,2" />
      <!-- Base & Entrance -->
      <rect x="-18" y="2" width="36" height="18" rx="2" />
      <path d="M -6 20 L -6 10 C -6 6, 6 6, 6 10 L 6 20 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Telugu Text: షాపింగ్ మాల్ (Shopping Mall) in deep navy blue -->
  <g transform="translate(250, 360)">
    <text x="0" y="0" 
          font-family="'Noto Sans Telugu', 'Gautami', 'Mandali', 'Arial', sans-serif" 
          font-size="36" 
          font-weight="800" 
          text-anchor="middle" 
          fill="#1E2958" 
          letter-spacing="2">
      షాపింగ్ మాల్
    </text>
  </g>
</svg>
