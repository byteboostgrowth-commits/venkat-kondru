<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="100%" height="100%">
  <defs>
    <!-- Weathered Dark Rustic Wood Grain -->
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1513" />
      <stop offset="20%" stop-color="#241C18" />
      <stop offset="35%" stop-color="#1B1613" />
      <stop offset="50%" stop-color="#28201B" />
      <stop offset="70%" stop-color="#181310" />
      <stop offset="85%" stop-color="#221A16" />
      <stop offset="100%" stop-color="#16120F" />
    </linearGradient>

    <!-- Warm Golden Amber Calligraphy Color -->
    <linearGradient id="zaikaAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBD38" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E0890B" />
    </linearGradient>

    <filter id="zaikaShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Rustic Wood Board Background -->
  <rect width="640" height="310" rx="14" fill="url(#woodBase)" />

  <!-- Vertical Wood Plank Grooves & Grain Lines -->
  <line x1="140" y1="0" x2="140" y2="310" stroke="#0D0A08" stroke-width="2.5" opacity="0.8" />
  <line x1="142" y1="0" x2="142" y2="310" stroke="#3D3028" stroke-width="1" opacity="0.35" />
  <line x1="310" y1="0" x2="310" y2="310" stroke="#0D0A08" stroke-width="3" opacity="0.85" />
  <line x1="312" y1="0" x2="312" y2="310" stroke="#3D3028" stroke-width="1" opacity="0.35" />
  <line x1="490" y1="0" x2="490" y2="310" stroke="#0D0A08" stroke-width="2.5" opacity="0.8" />
  <line x1="492" y1="0" x2="492" y2="310" stroke="#3D3028" stroke-width="1" opacity="0.35" />

  <!-- Subtle horizontal wood grain textures -->
  <path d="M 0 45 Q 160 50, 320 42 T 640 46" stroke="#2B211C" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 0 160 Q 200 155, 420 165 T 640 158" stroke="#2B211C" stroke-width="1.5" fill="none" opacity="0.3" />
  <path d="M 0 250 Q 180 258, 360 248 T 640 252" stroke="#2B211C" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- "Zaika" Script Calligraphy in Mustard Amber -->
  <g filter="url(#zaikaShadow)">
    <text x="280" y="188" 
          font-family="'Great Vibes', 'Brush Script MT', 'Dancing Script', 'Allura', cursive" 
          font-size="172" 
          font-weight="bold" 
          font-style="italic" 
          text-anchor="middle" 
          fill="url(#zaikaAmber)">
      Zaika
    </text>
  </g>

  <!-- "A/C" in crisp clean white -->
  <text x="560" y="180" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="34" 
        font-weight="700" 
        text-anchor="middle"
        fill="#FFFFFF" 
        letter-spacing="1">
    A/C
  </text>

  <!-- "THE FAMILY RESTAURANT" in clean white spaced caps -->
  <text x="320" y="275" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="25" 
        font-weight="600" 
        letter-spacing="11" 
        text-anchor="middle" 
        fill="#FFFFFF">
    THE FAMILY RESTAURANT
  </text>
</svg>
