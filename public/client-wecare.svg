<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <!-- White Background Rectangle -->
  <rect width="650" height="250" rx="8" fill="#FFFFFF" />

  <!-- ================= EMBLEM: SUPPORTIVE HAND, WHEELCHAIR & REHABILITATION ================= -->
  <g transform="translate(100, 125)">
    <!-- 1. Outer Deep Navy Enclosing Crescent & Supporting Cupped Hand -->
    <path d="M 0 -85 
             C -55 -85, -95 -45, -95 10 
             C -95 65, -55 95, 0 95 
             C 25 95, 50 85, 68 65 
             C 45 75, 15 72, -15 65 
             C -35 60, -52 45, -55 25 
             C -58 5, -52 -15, -45 -35 
             C -32 -60, -10 -72, 10 -72 
             C 5 -82, -2 -85, 0 -85 Z" 
          fill="#0B4F8A" />

    <!-- Supporting Hand Cupping from below -->
    <path d="M -55 25 
             C -35 68, 10 75, 52 50 
             C 40 50, 15 45, -10 35 
             C -25 30, -42 22, -55 25 Z" 
          fill="#0B4F8A" />

    <!-- 2. Teal Circular Therapy Ball / Wheelchair Wheel -->
    <circle cx="-35" cy="40" r="24" fill="#008CA8" />
    <circle cx="-35" cy="40" r="16" fill="#FFFFFF" />
    <circle cx="-35" cy="40" r="10" fill="#008CA8" />

    <!-- 3. Blue Rehabilitating Figure (Left) -->
    <!-- Head -->
    <circle cx="-32" cy="-35" r="7" fill="#0B4F8A" />
    <!-- Dynamic Body reaching up -->
    <path d="M -36 -22 C -20 -15, -12 10, -22 30 C -26 22, -24 5, -34 -15 Z" fill="#0B4F8A" />
    <path d="M -34 -15 C -25 -28, -12 -38, 5 -45 C -5 -35, -15 -25, -28 -10 Z" fill="#0B4F8A" />

    <!-- 4. Green Dynamic Celebrating Figure (Right) -->
    <!-- Head -->
    <circle cx="22" cy="-32" r="7" fill="#22C55E" />
    <!-- Rising spine and limbs -->
    <path d="M 16 -20 C 18 5, 25 28, 28 42 C 22 28, 12 8, 8 -15 Z" fill="#22C55E" />
    <path d="M 12 -18 C 22 -32, 35 -40, 48 -45 C 36 -35, 24 -22, 18 -10 Z" fill="#22C55E" />

    <!-- Golden Sparkle / Hope Dot above figures -->
    <circle cx="-5" cy="-55" r="4.5" fill="#EAB308" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- 1. "WeCare" in Bold Royal Navy Blue -->
  <g transform="translate(210, 105)">
    <text x="0" y="0" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="70" 
          font-weight="900" 
          letter-spacing="-1" 
          fill="#0B4F8A">
      WeCare
    </text>

    <!-- Cursive Slogan: "...the care you deserve" -->
    <text x="268" y="-5" 
          font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive" 
          font-size="24" 
          font-style="italic" 
          font-weight="bold" 
          fill="#0B4F8A">
      ...the care you deserve
    </text>
  </g>

  <!-- 2. Red Banner Badge: ADVANCED NEURO & ORTHO REHAB -->
  <g transform="translate(210, 140)">
    <rect x="0" y="0" width="370" height="28" rx="4" fill="#E5252A" />
    <text x="185" y="19" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="16" 
          font-weight="900" 
          letter-spacing="1" 
          text-anchor="middle" 
          fill="#FFFFFF">
      ADVANCED NEURO &amp; ORTHO REHAB
    </text>
  </g>

  <!-- 3. Subtitle: Physiotherapy | Rehabilitation Center in Teal -->
  <text x="210" y="195" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="18" 
        font-weight="600" 
        letter-spacing="0.5" 
        fill="#008CA8">
    Physiotherapy | Rehabilitation Center
  </text>
</svg>
