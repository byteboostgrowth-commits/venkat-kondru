<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Speech Bubble Icon (AG) -->
  <g transform="translate(250, 190)">
    <!-- Clipped Speech Bubble Container -->
    <defs>
      <clipPath id="speechBubbleClip">
        <!-- Rounded square speech bubble with bottom-left pointer tail -->
        <path d="M -130 -140 L 130 -140 C 152 -140, 170 -122, 170 -100 L 170 80 C 170 102, 152 120, 130 120 L -20 120 L -75 165 L -60 120 L -130 120 C -152 120, -170 102, -170 80 L -170 -100 C -170 -122, -152 -140, -130 -140 Z" />
      </clipPath>
    </defs>

    <g clip-path="url(#speechBubbleClip)">
      <!-- Upper-Right Navy Blue Half -->
      <rect x="-180" y="-150" width="360" height="320" fill="#0A3E66" />
      
      <!-- Diagonal Orange Lower-Left Polygon -->
      <polygon points="-180,170 180,170 -70,-150 -180,-150" fill="#E87722" />

      <!-- Big Bold White "A" on Orange Section -->
      <g transform="translate(-85, 10)">
        <text x="0" y="55" 
              font-family="'Montserrat', 'Arial Black', sans-serif" 
              font-size="190" 
              font-weight="900" 
              text-anchor="middle" 
              fill="#FFFFFF">
          A
        </text>
      </g>

      <!-- Big Bold White "G" on Navy Blue Section -->
      <g transform="translate(68, 5)">
        <text x="0" y="55" 
              font-family="'Montserrat', 'Arial Black', sans-serif" 
              font-size="205" 
              font-weight="900" 
              text-anchor="middle" 
              fill="#FFFFFF">
          G
        </text>
      </g>
    </g>
  </g>

  <!-- Brand Typography: Ambitious Guidance -->
  <g transform="translate(250, 395)">
    <!-- "Ambitious" (Navy) + "Guidance" (Orange) -->
    <text x="0" y="0" text-anchor="middle">
      <tspan font-family="'Montserrat', 'Arial', sans-serif" font-size="44" font-weight="800" fill="#0A3E66">Ambitious </tspan>
      <tspan font-family="'Montserrat', 'Arial', sans-serif" font-size="44" font-weight="800" fill="#E87722">Guidance</tspan>
    </text>

    <!-- Horizontal Divider Line -->
    <line x1="-210" y1="18" x2="210" y2="18" stroke="#0A3E66" stroke-width="2" />

    <!-- Subtitle: Expand your Horizons -->
    <text x="0" y="48" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-size="24" 
          font-weight="600" 
          letter-spacing="5.5" 
          text-anchor="middle" 
          fill="#1E293B">
      Expand your Horizons
    </text>
  </g>
</svg>
